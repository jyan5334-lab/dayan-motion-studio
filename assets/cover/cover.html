<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<!-- 大琰DAYAN Motion Studio 封面模板：A 手账贴纸 / B 科技海报 / C 电影海报；P = 有真人，T = 文字 + 背景。数据来自 data.js（dms_cover.py 生成） -->
<link rel="stylesheet" href="fonts.css">
<script src="fontlist.js"></script>
<script src="data.js"></script>
<style>
@font-face{font-family:DMSSmiley;src:url(smiley.woff2)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#000;overflow:hidden}
#root{position:relative;overflow:hidden;font-weight:900;color:#1A1A1A}
.abs{position:absolute}
.nw{white-space:nowrap}
.en{font-family:var(--en);font-weight:900;letter-spacing:-.025em}
.ttl .ln{white-space:nowrap;display:block}
.ttl .vs{font-size:.55em;font-style:italic;letter-spacing:0;margin:0 .12em;vertical-align:.18em;opacity:.92}
.aside{display:flex;flex-wrap:wrap;align-items:flex-start;gap:var(--g);transform-origin:0 0}
.T .aside{justify-content:center}
.person{position:absolute}
.person img{width:100%;height:100%;object-fit:contain;object-position:center bottom;display:block}
.person.r img{object-position:right bottom}
.person.l img{object-position:left bottom}
.pcard{position:absolute;overflow:hidden}
.pcard img{width:100%;height:100%;object-fit:cover;object-position:50% 28%;display:block}
/* ---------- A 手账贴纸 ---------- */
.A{background:#F6EFE3}
.A .bgx{position:absolute;inset:0;background-image:linear-gradient(rgba(60,40,20,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(60,40,20,.05) 1px,transparent 1px);background-size:46px 46px}
.A .bgy{position:absolute;inset:0;background:radial-gradient(60% 50% at 85% 5%,rgba(255,180,110,.28),transparent 70%),radial-gradient(60% 50% at 0% 100%,rgba(255,140,90,.18),transparent 70%)}
.A .ttl{line-height:1.12;letter-spacing:-.02em;color:#1A1A1A}
.A .ttl .en{font-family:DMSSmiley,var(--en);font-weight:400;letter-spacing:0;font-size:1.05em}
.A .ttl .hl{color:#FF5A1F;position:relative;display:inline-block;z-index:0}
.A .ttl .hl::after{content:"";position:absolute;left:-3%;right:-3%;bottom:.06em;height:.24em;background:#FFD23F;z-index:-1;border-radius:.1em;transform:rotate(-1.5deg)}
.A .sub{display:inline-block;background:#1F2A44;color:#fff;padding:.38em 1em .42em;border-radius:.14em;transform:rotate(-2deg);box-shadow:.14em .14em 0 #1A1A1A;white-space:nowrap}
.A .sub b{color:#FFD23F}
.A .shot{position:relative;background:#fff;padding:.18em .18em .62em;border:.06em solid #1A1A1A;box-shadow:.12em .14em 0 #1A1A1A}
.A .shot img{display:block;width:100%;border:.04em solid #1A1A1A}
.A .shot > span{position:absolute;left:0;right:0;bottom:.12em;text-align:center;font-size:.42em;white-space:nowrap}
.A .shot i{position:absolute;width:2.6em;height:.7em;background:rgba(255,210,63,.8);left:50%;top:-.32em;transform:translateX(-50%) rotate(-6deg)}
.A .bdg{background:#fff;border:.08em solid #1A1A1A;box-shadow:.12em .14em 0 #1A1A1A;border-radius:.3em;padding:.3em .55em .36em;text-align:center;line-height:1}
.A .bdg b{display:block;font-family:var(--en);font-weight:900;color:#FF5A1F;font-size:1.5em}
.A .bdg small{display:block;font-size:.5em;margin-top:.35em;white-space:nowrap}
.A .bdg:nth-child(3n+2){background:#FFE867}
.A .note{background:#FFE867;border:.08em solid #1A1A1A;box-shadow:.12em .14em 0 #1A1A1A;padding:.45em .7em;line-height:1.25;transform:rotate(3deg);white-space:nowrap}
.A .note b{color:#FF5A1F}
/* ---------- B 科技海报 ---------- */
.B .bgx{position:absolute;inset:0;background:radial-gradient(40% 35% at 18% 16%,rgba(255,255,255,.35),transparent 70%),radial-gradient(40% 35% at 86% 30%,rgba(255,236,200,.4),transparent 70%),radial-gradient(60% 40% at 50% 112%,rgba(20,0,30,.5),transparent 70%)}
.B .bgy{position:absolute;inset:0;opacity:.13;background-image:linear-gradient(rgba(255,255,255,.7) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.7) 1px,transparent 1px);background-size:60px 60px;mask-image:radial-gradient(70% 70% at 50% 50%,#000,transparent);-webkit-mask-image:radial-gradient(70% 70% at 50% 50%,#000,transparent)}
.B .ttl{color:#fff;line-height:1.02;filter:drop-shadow(0 .04em 0 rgba(40,10,30,.5)) drop-shadow(0 .1em .08em rgba(30,0,20,.4))}
.B .ttl .en{letter-spacing:-.035em}
.B .ttl .hl{display:inline-block;padding:0 .2em .06em;margin:0 .04em;border-radius:.16em;background:#14131C;color:var(--c1);filter:none;box-shadow:0 .08em .25em rgba(0,0,0,.35)}
.B .sub{display:inline-block;padding:.45em 1.1em .5em;border-radius:99px;background:#fff;color:var(--c2);white-space:nowrap;box-shadow:0 .2em .6em rgba(40,0,20,.3)}
.B .shot{position:relative;background:rgba(255,255,255,.16);border:1.5px solid rgba(255,255,255,.6);backdrop-filter:blur(10px);box-shadow:0 .3em 1em rgba(30,0,20,.35),inset 0 1px 0 rgba(255,255,255,.6);border-radius:.45em;padding:.22em}
.B .shot img{display:block;width:100%;border-radius:.3em}
.B .shot > span{position:absolute;left:.45em;top:.45em;padding:.12em .45em .16em;border-radius:99px;font-size:.36em;color:#fff;background:rgba(20,19,28,.8);white-space:nowrap}
.B .bdg{border-radius:.36em;padding:.3em .55em .34em;color:#fff;line-height:1;text-align:center;box-shadow:0 .2em .6em rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.5);background-color:rgba(20,19,28,.55);border:1.5px solid rgba(255,255,255,.55);backdrop-filter:blur(8px)}
.B .bdg b{display:block;font-family:var(--en);font-weight:900;font-size:1.45em}
.B .bdg small{display:block;font-size:.5em;margin-top:.35em;white-space:nowrap;opacity:.92}
.B .note{padding:.4em .9em .45em;border-radius:99px;background:rgba(20,19,28,.75);color:#fff;white-space:nowrap;border:1px solid rgba(255,255,255,.25)}
.B .note b{color:var(--c1)}
.B .wm{position:absolute;font-family:var(--en);font-weight:900;color:rgba(255,255,255,.08);white-space:nowrap;line-height:.8;letter-spacing:-.04em}
.B .orb{position:absolute;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.75),rgba(255,255,255,.12) 45%,rgba(255,255,255,0) 70%);border:1px solid rgba(255,255,255,.35)}
/* ---------- C 电影海报 ---------- */
.C{background:#0B1620}
.C .bgx{position:absolute;inset:0;background:radial-gradient(55% 45% at 72% 38%,rgba(30,90,110,.9),transparent 70%),radial-gradient(45% 40% at 20% 75%,rgba(255,150,40,.32),transparent 70%),linear-gradient(180deg,#07101A,#0B1620 50%,#05090E)}
.C .bgy{position:absolute;inset:0;background:conic-gradient(from 200deg at 85% -10%,transparent 0 8deg,rgba(255,200,120,.16) 12deg,transparent 22deg,rgba(255,200,120,.08) 30deg,transparent 40deg);mix-blend-mode:screen}
.C .grain{position:absolute;inset:0;opacity:.14;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.C .ttl{line-height:1.1;letter-spacing:-.03em;color:#FFC21A;-webkit-text-stroke:.05em #120C04;paint-order:stroke fill;filter:drop-shadow(0 .06em 0 #6B3E00) drop-shadow(0 0 .35em rgba(255,170,40,.45))}
.C .ttl .hl{color:#FF3B2E}
.C .lab{font-family:var(--en);font-weight:700;letter-spacing:.42em;color:#E7D6A8;opacity:.85;white-space:nowrap;margin-bottom:.9em}
.C .sub{display:inline-block;background:#FFC21A;color:#120C04;padding:.3em .8em .34em;white-space:nowrap;box-shadow:0 0 1em rgba(255,194,26,.35)}
.C .shot{position:relative;border-radius:.2em;overflow:hidden;border:1px solid rgba(255,200,120,.45);box-shadow:0 0 1.2em rgba(255,150,40,.35),0 .3em 1em rgba(0,0,0,.6)}
.C .shot img{display:block;width:100%;filter:saturate(1.1) contrast(1.05)}
.C .shot > span{position:absolute;left:0;right:0;bottom:0;padding:.3em .5em;font-size:.36em;color:#FFE7B0;background:linear-gradient(0deg,rgba(0,0,0,.75),transparent);white-space:nowrap}
.C .bdg{border-radius:.26em;color:#fff;line-height:1;text-align:center;padding:.36em .5em .4em;border:1.5px solid var(--g);box-shadow:0 0 .9em var(--g),inset 0 1px 0 rgba(255,255,255,.35);background-color:var(--bg)}
.C .bdg b{display:block;font-family:var(--en);font-weight:900;font-size:1.4em}
.C .bdg small{display:block;font-weight:700;font-size:.46em;letter-spacing:.06em;opacity:.85;margin-top:.4em;white-space:nowrap}
.C .note{color:#FFE7B0;border:.08em solid rgba(255,194,26,.9);padding:.35em .8em .4em;white-space:nowrap;background:rgba(40,30,12,.85);box-shadow:0 0 .8em rgba(255,170,40,.35)}
.C .note b{color:#FF3B2E}
.C .horizon{position:absolute;border-radius:50%;border-top:3px solid rgba(255,170,60,.9);box-shadow:0 -10px 60px rgba(255,140,40,.55),inset 0 20px 80px rgba(255,140,40,.25)}
.C .bigl{position:absolute;font-family:var(--en);font-weight:900;color:rgba(255,220,160,.05);white-space:nowrap;letter-spacing:-.03em}
</style></head><body>
<div id="root"></div>
<script>
const Q = new URLSearchParams(location.search), S = Q.get('s') || 'A', W = +Q.get('w') || 1080, H = +Q.get('h') || 1440, V = H > W;
const C0 = window.COVER || {}; const d = Object.assign({}, C0, (C0.styles || {})[S] || {});
const PER = (C0.people || {})[S]; const MODE = PER ? 'P' : 'T';
const u = Math.min(W, H) / 1080, px = n => Math.round(n * u);
const root = document.getElementById('root'); root.className = S + ' ' + MODE; root.style.width = W + 'px'; root.style.height = H + 'px';
const CN = (window.COVER_FONTS || []).map(f => `"${f}"`).concat(['"Alibaba PuHuiTi 3.0"', '"Source Han Sans SC"', '"Noto Sans SC"', '"Noto Sans CJK SC"', '"PingFang SC"', '"Microsoft YaHei"', 'sans-serif']).join(',');
root.style.setProperty('--en', '"Inter","Montserrat","Poppins","Arial Black","Segoe UI",' + CN); root.style.fontFamily = CN;
const col = d.colors || ['#FF9A3C', '#E8561A']; root.style.setProperty('--c1', col[0]); root.style.setProperty('--c2', col[1] || col[0]);
if (S === 'B') root.style.background = `linear-gradient(120deg, ${col[0]} 0%, ${col[1] || col[0]} 100%)`;
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const enWrap = s => esc(s).replace(/([A-Za-z0-9][A-Za-z0-9.+×%\-/]*(?:\s+[A-Za-z0-9][A-Za-z0-9.+×%\-/]*)*)/g, '<span class="en">$1</span>');
/* 标题里的 vs 缩成小号斜体，长标题能排得更大 */
const vsWrap = h => h.replace(/(^|\s|>)(vs|VS|Vs)(?=\s|<|$)/g, '$1<span class="vs">$2</span>');
const bold = s => esc(s).replace(/\s+\/\s+|\s*\n\s*/g, '<br>').replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
let hlUsed = false;
function rich(line) {
  const hl = d.hl; const k = hl && !hlUsed ? line.indexOf(hl) : -1;
  if (k < 0) return enWrap(line);
  hlUsed = true; return enWrap(line.slice(0, k)) + `<span class="hl">${enWrap(hl)}</span>` + enWrap(line.slice(k + hl.length));
}
const el = (cls, html, parent, css) => { const e = document.createElement('div'); e.className = cls; e.innerHTML = html; Object.assign(e.style, css || {}); (parent || root).appendChild(e); return e; };

/* ---------- 背景与装饰 ---------- */
el('abs bgx', '', root, { inset: 0 }); el('abs bgy', '', root, { inset: 0 }); if (S === 'C') el('grain', '', root);
const star = (s, c = '#FFD23F') => `<svg width="${s}" height="${s}" viewBox="0 0 100 100"><path d="M50 6 L60 38 L94 40 L66 60 L76 94 L50 74 L24 94 L34 60 L6 40 L40 38 Z" fill="${c}" stroke="#1A1A1A" stroke-width="5" stroke-linejoin="round"/></svg>`;
const wmText = (d.brand && d.brand.mark) || ((d.title || []).join('').match(/[A-Za-z][A-Za-z0-9]+/) || [''])[0] || 'AI';
if (MODE === 'T') {
  if (S === 'B') { el('wm', esc(wmText), root, { fontSize: px(V ? 560 : 520) + 'px', right: px(-40) + 'px', bottom: px(V ? 40 : -20) + 'px' }); [[.82, .12, 120], [.08, .78, 80], [.9, .7, 56]].forEach(([x, y, s]) => el('orb', '', root, { left: x * W + 'px', top: y * H + 'px', width: px(s) + 'px', height: px(s) + 'px' })); }
  if (S === 'C') { const R = W * 1.6; el('horizon', '', root, { width: R + 'px', height: R + 'px', left: (W - R) / 2 + 'px', top: H * (V ? 0.8 : 0.78) + 'px' }); el('bigl', esc(wmText), root, { fontSize: px(420) + 'px', left: px(40) + 'px', bottom: px(V ? 260 : 120) + 'px' }); }
  if (S === 'A') { el('abs', star(px(120)), root, V ? { right: px(80) + 'px', bottom: px(250) + 'px', transform: 'rotate(12deg)' } : { right: px(60) + 'px', top: px(60) + 'px', transform: 'rotate(12deg)' }); el('abs', star(px(80), '#2F6BFF'), root, { left: px(60) + 'px', bottom: px(V ? 230 : 90) + 'px', transform: 'rotate(-10deg)' }); }
} else {
  if (S === 'A') el('abs', star(px(V ? 110 : 96)), root, { right: px(V ? 60 : 50) + 'px', top: px(V ? 60 : 50) + 'px', transform: 'rotate(12deg)', zIndex: 1 });
}

/* ---------- 几何 ---------- */
const asideItems = [];
(d.shots || []).forEach(s => asideItems.push({ k: 'shot', s }));
(d.badges || []).forEach(b => asideItems.push({ k: 'bdg', b }));
if (d.note) asideItems.push({ k: 'note' });
const hasAside = asideItems.length > 0;
let G;
if (MODE === 'P') G = V ? { hx: 70, hy: 120, hw: W / u - 140, hh: 0.3 * H / u, ax: 60, aw: 0.38 * W / u, ab: 0.86 * H / u, max: 124, pw: 0.64, ph: 0.6 }
                        : { hx: 0.05 * W / u, hy: 0.075 * H / u, hw: 0.55 * W / u, hh: 0.38 * H / u, ax: 0.05 * W / u, aw: 0.55 * W / u, ab: 0.93 * H / u, max: 108, pw: 0.45, ph: 0.86 };
else if (V) G = { hx: 44, hy: 0.12 * H / u, hw: W / u - 88, hh: 0.4 * H / u, ax: 70, aw: W / u - 140, ab: 0.86 * H / u, max: 200, tight: 1 };
else G = hasAside ? { hx: 0.045 * W / u, hy: 0.12 * H / u, hw: 0.56 * W / u, hh: 0.66 * H / u, ax: 0.635 * W / u, ay: 0.1 * H / u, aw: 0.33 * W / u, ab: 0.9 * H / u, max: 180, tight: 1 }
                  : { hx: 0.06 * W / u, hy: 0.16 * H / u, hw: 0.88 * W / u, hh: 0.56 * H / u, ax: 0.08 * W / u, aw: 0.84 * W / u, ab: 0.9 * H / u, max: 210, center: 1, tight: 1 };
if (S === 'C' && MODE === 'P') G.max *= 1.0;

/* ---------- 标题块 ---------- */
const head = el('abs head', '', root, { left: px(G.hx) + 'px', top: px(G.hy) + 'px', width: px(G.hw) + 'px', zIndex: 3, textAlign: (G.center || (MODE === 'T' && S !== 'A')) ? 'center' : 'left' });
if (S === 'C' && d.label) el('lab', esc(d.label), head, { fontSize: px(V ? 24 : 22) + 'px' });
const ttl = el('ttl', (d.title || []).map(l => `<span class="ln">${MODE === "T" ? vsWrap(rich(l)) : rich(l)}</span>`).join(''), head);
if (G.tight) { ttl.style.letterSpacing = V ? '-.06em' : '-.045em'; ttl.style.lineHeight = S === 'A' ? '1.08' : '1.02'; }
const subw = d.sub ? el('', `<span class="sub">${enWrap(d.sub).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')}</span>`, head, { marginTop: px(S === 'C' ? 34 : 30) + 'px' }) : null;

/* ---------- 话题元素 ---------- */
const aside = el('abs aside', '', root, { left: px(G.ax) + 'px', width: px(G.aw) + 'px', zIndex: 2 });
aside.style.setProperty('--g', px(S === 'A' ? 30 : 24) + 'px');
const CG = [['#6A3E12', 'rgba(255,170,60,.95)'], ['#2B3C86', 'rgba(140,165,255,.9)'], ['#6E1E1A', 'rgba(255,100,80,.9)']];
asideItems.forEach((it, i) => {
  if (it.k === 'shot') {
    const w = px(MODE === 'P' ? (V ? 330 : 300) : (V ? 420 : 262));
    const e = el('shot', `${S === 'A' ? '<i></i>' : ''}<img src="${esc(it.s.src)}">${it.s.label ? `<span>${enWrap(it.s.label)}</span>` : ''}`, aside, { width: w + 'px', fontSize: w / 5.2 + 'px', transform: `rotate(${S === 'C' ? 0 : (i % 2 ? 3 : -4)}deg)` });
  } else if (it.k === 'bdg') {
    const e = el('bdg', `<b>${esc(it.b.t)}</b>${it.b.d ? `<small>${esc(it.b.d)}</small>` : ''}`, aside, { fontSize: px(MODE === 'P' ? 44 : (V ? 54 : 46)) + 'px', minWidth: px(MODE === 'P' ? 150 : (V ? 180 : 150)) + 'px' });
    if (S === 'C') { e.style.setProperty('--bg', CG[i % 3][0]); e.style.setProperty('--g', CG[i % 3][1]); }
    if (S === 'A') e.style.transform = `rotate(${[-3, 2, -1][i % 3]}deg)`;
  } else el('note', bold(d.note), aside, { fontSize: px(MODE === 'P' ? 34 : 40) + 'px' });
});

/* ---------- 人物 ---------- */
if (PER) {
  const box = { right: '0px', bottom: '0px', width: W * G.pw + 'px', height: H * G.ph + 'px', zIndex: 2 };
  if (S === 'C') {   // 暗底 + 深色衣服容易糊在一起：人物身后打一盏青色背光，把轮廓和背景分开
    el('abs', '', root, { right: -W * G.pw * .15 + 'px', bottom: -H * .1 + 'px', width: W * G.pw * 1.3 + 'px', height: H * G.ph * 1.05 + 'px', zIndex: 1,
      background: 'radial-gradient(50% 50% at 50% 55%, rgba(70,170,215,.55), rgba(40,110,150,.25) 45%, transparent 72%)' });
  }
  if (PER.cut) {
    const e = el('person' + ((PER.edges || []).includes('right') ? ' r' : ''), `<img src="${esc(PER.src)}">`, root, box);
    if ((PER.edges || []).includes('left') && !(PER.edges || []).includes('right')) e.style.webkitMaskImage = e.style.maskImage = 'linear-gradient(90deg,transparent 0,#000 12%)';
    if (S === 'B') e.style.filter = `drop-shadow(0 0 ${px(30)}px rgba(255,255,255,.35))`;
    if (S === 'C') e.style.filter = `drop-shadow(0 0 ${px(26)}px rgba(70,170,210,.55)) drop-shadow(${px(-6)}px 0 ${px(4)}px rgba(255,190,110,.35))`;
  } else {   // 没有抠图模型：照片卡
    const cw = W * G.pw * 0.86, ch = Math.min(H * G.ph * 0.92, cw * 4 / 3);
    const e = el('pcard', `<img src="${esc(PER.src)}">`, root, { right: px(50) + 'px', bottom: (V ? H * 0.14 : px(60)) + 'px', width: cw + 'px', height: ch + 'px', zIndex: 2,
      borderRadius: px(S === 'C' ? 10 : 26) + 'px', border: S === 'A' ? `${px(12)}px solid #fff` : `2px solid rgba(255,255,255,.6)`,
      boxShadow: S === 'A' ? `${px(8)}px ${px(10)}px 0 #1A1A1A` : S === 'B' ? `0 ${px(20)}px ${px(60)}px rgba(0,0,0,.35)` : `0 0 ${px(40)}px rgba(255,150,40,.4)`, transform: S === 'A' ? 'rotate(2deg)' : '' });
  }
}

/* ---------- 排版：标题按宽高自动缩字号，话题元素按剩余空间缩放 ---------- */
/* ---------- 前景 / 背景对比（用户 2026-11-13 定：封面要和设计美学挂钩，前景色和背景色必须鲜明对比，深字压深底 = 失败）----------
   每一处文字都算一遍 WCAG 对比度：文字色 vs 它真正落在的底色（自己的色块；半透明色块按页面底色混合；没有色块就取页面该位置的背景色）。
   大字（≥ 48px）至少 3:1，其余至少 4.5:1；不够就自动修：色块里的字换成能看清的颜色，浮在背景上的字加反差描边 / 换深浅玻璃底。 */
const rgbOf = c => { c = String(c).trim(); if (c.startsWith('rgb')) { const m = c.match(/[\d.]+/g).map(Number); return { c: m.slice(0, 3), a: m.length > 3 ? m[3] : 1 }; } c = c.replace('#', ''); if (c.length === 3) c = c.split('').map(x => x + x).join(''); return { c: [0, 2, 4].map(i => parseInt(c.substr(i, 2), 16)), a: 1 }; };
const lum = v => { const a = v.map(x => { x /= 255; return x <= .03928 ? x / 12.92 : Math.pow((x + .055) / 1.055, 2.4); }); return .2126 * a[0] + .7152 * a[1] + .0722 * a[2]; };
